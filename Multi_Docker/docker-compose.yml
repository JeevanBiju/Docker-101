version: '3.9'

services:

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "28017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11534:11434"
    volumes:
      - ollama_models:/root/.ollama

  app:
    build: ./app
    container_name: python-app
    depends_on:
      - mongodb
      - ollama
    environment:
      MONGO_URI: "mongodb://mongodb:27017"
      OLLAMA_URL: "http://ollama:11434"
    ports:
      - "9000:8000"  
    volumes:
      - ./app:/app

volumes:
  mongo_data:
  ollama_models:
